[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kinder_bilevel_planning"
version = "0.1.0"
description = " Bilevel planning baselines for KinDER."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "matplotlib",
   "numpy",
   "pandas",
   "pandas-stubs",
   "hydra-core",
   "hydra-joblib-launcher",
   "omegaconf",
   # Temporary git pin: the CylinderShelf3D env is not yet in a PyPI
   # kindergarden release. Move back to a plain version pin at the next
   # kindergarden release.
   "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@bf420c4404168c13c3ac3270c19918810aa0d4c7",
   "prpl_utils>=0.0.7",
   "relational_structs>=0.0.1",
   "tomsgeoms2d>=0.0.1",
   "pybullet_helpers>=0.0.1",
   "bilevel_planning>=0.1.4",
]

[project.optional-dependencies]
# Backs the kinematic3d_v2 env models. See the same extra in kinder-models.
prpl-kinematics = ["prpl_kinematics[planning]>=0.0.1"]
develop = [
    # Installed for development and CI so the kinematic3d_v2 models are linted, type
    # checked, and tested.
    "prpl_kinematics[planning]>=0.0.1",
    "black",
    "docformatter",
    "ipykernel",
    "isort",
    "mypy",
    "nbmake",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    # pytest 9.1 dropped the `path` arg from the pytest_collect_file hookspec,
    # which pytest-pylint 0.21.0 still uses -- it crashes the lint job. Temporary
    # cap; see https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden/issues/111
    "pytest>=7.2.2,<9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinder_bilevel_planning = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "third-party/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "third-party/*"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    # Optional; see the prpl-kinematics extra.
    "prpl_kinematics.*",
    "spatialmath.*",
    "pybullet.*",
    "mujoco",
    "mujoco.*",
    "ruckig",
    "ruckig.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=third-party"]
