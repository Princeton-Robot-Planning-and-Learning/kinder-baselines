[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kinder_models"
version = "0.1.0"
description = "Models for KinDER baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "matplotlib",
   "numpy",
   "scipy",
   "spatialmath-python",
   "h5py",
   "flask-socketio",
   "opencv-python>=4.9.0",
   # Temporary git pin: the CylinderShelf3D env is not yet in a PyPI
   # kindergarden release. Move back to a plain version pin at the next
   # kindergarden release.
   "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@bf420c4404168c13c3ac3270c19918810aa0d4c7",
   "relational_structs>=0.0.1",
   "bilevel_planning>=0.1.2",
]

[project.optional-dependencies]
# Backs the kinematic3d_v2 skills. Optional for the same reason it is optional in
# kindergarden: it overlaps heavily with pybullet_helpers and both are large. The
# `planning` extra of prpl_kinematics adds OMPL, which the skills prefer when present
# and fall back from to BiRRT when absent.
prpl-kinematics = ["prpl_kinematics[planning]>=0.0.1"]
develop = [
    # Installed for development and CI so the kinematic3d_v2 skills are linted, type
    # checked, and tested.
    "prpl_kinematics[planning]>=0.0.1",
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    # pytest 9.1 dropped the `path` arg from the pytest_collect_file hookspec,
    # which pytest-pylint 0.21.0 still uses -- it crashes the lint job. Temporary
    # cap; see https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden/issues/111
    "pytest>=7.2.2,<9.1",
    "ruckig>=0.12.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinder_models = ["py.typed"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*", "third-party/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*", "third-party/*"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    # Optional; see the prpl-kinematics extra.
    "prpl_kinematics.*",
    "spatialmath.*",
    "pybullet.*",
    "pygame.*",
    "dill.*",
    "mujoco.*",
    "pin.*",
    "ruckig.*",
    "flask.*",
    "flask_socketio.*",
    "zmq.*",
    "redis.*",
    "phoenix6.*",
    "cv2.*",
    "pybullet.*",
    "spatialmath.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--ignore=third-party"]
