name: CI Checks

on:
  push:
    branches: [main]  # Run all tests on main
  pull_request:       # Run selective tests on PRs

env:
  # Tell git/uv to NOT download LFS blobs, just keep pointer files
  GIT_LFS_SKIP_SMUDGE: "1"

  # Base SHA for selective testing in PRs
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

  # Run tests sequentially instead of in parallel
  SEQUENTIAL: "true"

jobs:
  autoformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Run autoformat
        run: uv run ./run_in_affected_packages.sh "./run_autoformat.sh"

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, and OSMESA
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint
        run: |
          uv run ./run_in_affected_packages.sh "pytest . --pylint -m pylint --pylint-rcfile=.pylintrc -p no:cacheprovider"

  static-type-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Mypy
        run: |
          uv run ./run_in_affected_packages.sh "mypy . --no-incremental"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install LAPACK BLAS, and OSMESA
        run: |
          sudo apt-get update
          sudo apt-get install -y liblapack-dev libblas-dev libosmesa6-dev libgl1 libglx-mesa0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Pre-install IKFast modules
        run: |
          if [ -f pybullet-helpers/scripts/preinstall_ikfast.py ]; then
            echo "Pre-installing IKFast modules to avoid parallel test conflicts..."
            cd pybullet-helpers
            uv run python scripts/preinstall_ikfast.py
            cd ..
          fi

      # pddlstream is not pip-installable, so kinder-pddlstream-planning uses a git
      # checkout with FastDownward built in-tree. It lives outside the workspace.
      - name: Resolve the pddlstream revision
        id: pddlstream-rev
        run: |
          sha=$(git ls-remote https://github.com/caelan/pddlstream.git HEAD | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Restore the pddlstream checkout
        id: pddlstream-cache
        uses: actions/cache@v4
        with:
          path: ~/pddlstream
          key: pddlstream-${{ runner.os }}-${{ steps.pddlstream-rev.outputs.sha }}
      - name: Build pddlstream
        if: steps.pddlstream-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/caelan/pddlstream.git ~/pddlstream
          ~/pddlstream/downward/build.py

      - name: Pytest
        env:
          MUJOCO_GL: "osmesa"
          PYOPENGL_PLATFORM: ""
          PDDLSTREAM_PATH: ~/pddlstream
        run: |
          uv run ./run_in_affected_packages.sh "pytest --cache-clear tests/"
