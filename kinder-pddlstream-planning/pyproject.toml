[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "kinder_pddlstream_planning"
version = "0.1.0"
description = "PDDLStream task and motion planning baselines for KinDER."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
   "numpy",
   "pillow",
   "kindergarden>=0.1.0",
   "kinder_models>=0.1.0",
   "pybullet_helpers>=0.0.1",
   # Pinned to a full SHA, not a tag: pip only reuses its cached VCS wheel for
   # 40-character SHAs, so a tag would recompile FastDownward on every CI run.
   "pddlstream @ git+https://github.com/Princeton-Robot-Planning-and-Learning/pddlstream.git@5919a844b8c947acdb49bedb6e8b2b93e6a70c0c",
]

[project.optional-dependencies]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2,<9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kinder_pddlstream_planning = ["py.typed", "**/*.pddl"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
py_version = 310
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*"]

[[tool.mypy.overrides]]
module = [
    "kinder.*",
    "pddlstream.*",
    "pybullet",
    "pybullet_helpers.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
